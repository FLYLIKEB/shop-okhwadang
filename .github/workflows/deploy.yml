name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-backend:
    name: Deploy Backend to EC2
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: EC2에 배포
        env:
          BACKEND_ENV_PRODUCTION: ${{ secrets.BACKEND_ENV_PRODUCTION }}
        run: |
          set -e

          cd /app/shop-okhwadang/shop-okhwadang/backend

          # ------------------------------------------------------------------
          # 1. 코드 동기화
          # ------------------------------------------------------------------
          git fetch origin main
          git reset --hard origin/main

          # ------------------------------------------------------------------
          # 2. 환경변수 확인 — 기본은 EC2 내부 .env / keys/ 를 신뢰한다.
          #    단, BACKEND_ENV_PRODUCTION secret 이 있으면 self-hosted
          #    runner 내부에서 원격 .env 를 복원한다. 로컬 수정은
          #    scripts/remote-env-sync.sh set-secret 로 반영한다.
          # ------------------------------------------------------------------
          if [ -n "${BACKEND_ENV_PRODUCTION:-}" ]; then
            printf '%s' "$BACKEND_ENV_PRODUCTION" > .env
            chmod 600 .env
            echo "BACKEND_ENV_PRODUCTION secret → backend/.env 복원 완료"
          fi

          [ -f .env ] || { echo "ERROR: backend/.env 가 원격에 없습니다. remote-env-sync.sh push 로 먼저 업로드하세요." >&2; exit 1; }
          [ -f keys/jwt-private.pem ] || { echo "ERROR: keys/jwt-private.pem 가 원격에 없습니다." >&2; exit 1; }
          [ -f keys/jwt-public.pem ] || { echo "ERROR: keys/jwt-public.pem 가 원격에 없습니다." >&2; exit 1; }
          chmod 600 .env keys/jwt-private.pem keys/jwt-public.pem

          # ------------------------------------------------------------------
          # 2-1. 필수 env 키 존재 여부 사전 검증
          #      .env.example 의 # REQUIRED 태그가 붙은 키를 파싱하여 확인.
          #      누락 시 배포를 즉시 중단 — PM2 크래시 루프 방지.
          # ------------------------------------------------------------------
          REQUIRED_KEYS=$(grep -E '#[[:space:]]*REQUIRED' .env.example | grep -oE '^[A-Z_]+' || true)
          MISSING_KEYS=""
          for key in $REQUIRED_KEYS; do
            if ! grep -qE "^${key}=.+" .env; then
              MISSING_KEYS="${MISSING_KEYS} ${key}"
            fi
          done
          if [ -n "$MISSING_KEYS" ]; then
            echo "ERROR: backend/.env 에 다음 필수 키가 없거나 비어 있습니다:${MISSING_KEYS}" >&2
            if [ -n "${BACKEND_ENV_PRODUCTION:-}" ]; then
              echo "       BACKEND_ENV_PRODUCTION secret 기준 검증에 실패했습니다." >&2
              echo "       scripts/remote-env-sync.sh set-secret 로 GitHub Secret 을 업데이트한 후 재배포하세요." >&2
            else
              echo "       scripts/remote-env-sync.sh push 로 EC2 .env 를 업데이트한 후 재배포하세요." >&2
            fi
            exit 1
          fi
          echo "필수 env 키 검증 통과"

          # ------------------------------------------------------------------
          # 3. 의존성 설치 및 빌드
          # ------------------------------------------------------------------
          npm ci
          npm run build
          test -f dist/main.js || { echo "ERROR: backend/dist/main.js 빌드 산출물이 없습니다. PM2 재시작 전에 배포를 중단합니다." >&2; exit 1; }

          # ------------------------------------------------------------------
          # 4. 마이그레이션/앱 재시작 전 런타임 사전 점검
          # ------------------------------------------------------------------
          set -a
          source .env
          set +a

          # 실패 시 배포 중지 (set -e 덕분에 자동으로 스크립트 중단)
          NODE_ENV=production npm run preflight:prod
          NODE_ENV=production npm run migration:run:prod

          # ------------------------------------------------------------------
          # 5. 불필요한 devDependencies 정리 (디스크 절약)
          # ------------------------------------------------------------------
          npm prune --omit=dev

          # ------------------------------------------------------------------
          # 6. PM2 로그 정책/서비스 재시작
          # ------------------------------------------------------------------
          # PM2 파일 로그는 /var/log/pm2 로 고정하고 pm2-logrotate 로 디스크 사용량을 제한한다.
          sudo mkdir -p /var/log/pm2
          sudo chown "$(id -un):$(id -gn)" /var/log/pm2
          chmod 750 /var/log/pm2

          if ! pm2 describe pm2-logrotate > /dev/null 2>&1; then
            pm2 install pm2-logrotate
          fi
          pm2 set pm2-logrotate:max_size 20M
          pm2 set pm2-logrotate:retain 14
          pm2 set pm2-logrotate:compress true
          pm2 set pm2-logrotate:rotateInterval "0 0 * * *"
          pm2 set pm2-logrotate:workerInterval 30
          pm2 set pm2-logrotate:rotateModule true

          # ecosystem.config.js 가 cwd, 엔트리포인트, 로그 경로를 단일 소스로 관리한다.
          # PM2는 기존 프로세스의 로그 경로를 reload만으로 바꾸지 않으므로,
          # 경로가 어긋난 구 프로세스는 한 번 재생성한다.
          if pm2 describe commerce > /tmp/commerce-pm2-describe.txt 2>/dev/null; then
            if ! grep -Fq '/var/log/pm2/commerce-out.log' /tmp/commerce-pm2-describe.txt \
              || ! grep -Fq '/var/log/pm2/commerce-error.log' /tmp/commerce-pm2-describe.txt; then
              pm2 delete commerce
            fi
          fi
          pm2 startOrReload ecosystem.config.js --env production --update-env
          pm2 save

          # ------------------------------------------------------------------
          # 7. 상태 확인 (烟雾测试)
          # ------------------------------------------------------------------
          # 앱이 완전히 기동될 때까지 최대 60초 대기 (10초 간격 6회)
          for i in $(seq 1 6); do
            sleep 10
            BODY=$(curl -s http://127.0.0.1:3000/api/health || true)
            STATUS=$(printf '%s' "$BODY" | node -e "let raw=''; process.stdin.on('data', c => raw += c); process.stdin.on('end', () => { try { const body = JSON.parse(raw); process.stdout.write(body.status === 'ok' && body.db && body.db.status === 'connected' ? '200' : '503'); } catch { process.stdout.write('000'); } });")
            if [ "$STATUS" = "200" ]; then
              echo "烟雾测试通过"
              exit 0
            fi
            echo "尝试 $i/6: health status=$STATUS body=$BODY — 10초 후 재시도..."
          done

          # 6회 시도 모두 실패
          echo "烟雾测试 실패 (health status=$STATUS)"
          pm2 logs commerce --lines 30 --nostream
          exit 1
